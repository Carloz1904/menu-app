<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Taqueria charly</h1>
    </header>

    <main>

        <section class="categoria">
            <h2>Tacos</h2>

            <div class="platillo">
                <span>Taco al pastor</span>
                <span>$25</span>
            </div>

            <div class="platillo">
                <span>Taco de asada</span>
                <span>$30</span>
            </div>

            <div class="platillo">
                <span>Taco de pollo</span>
                <span>$28</span>
            </div>
        </section>

        <section class="categoria">
            <h2>Bebidas</h2>

            <div class="platillo">
                <span>Refresco</span>
                <span>$20</span>
            </div>

            <div class="platillo">
                <span>Agua</span>
                <span>$15</span>
            </div>

            <div class="platillo">
                <span>Cerveza</span>
                <span>$35</span>
            </div>
        </section>
    </main>
    <footer>
        <p>Horario: 9am - 10pm </p>
    </footer>
</body>
</html>
